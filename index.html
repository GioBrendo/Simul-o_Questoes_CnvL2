<style>
:root{--ink:#eceae4;--dim:rgba(236,234,228,.58);--fa:rgba(236,234,228,.35);--cu:#d99a63;--bg:#0b0c0e;--hl:rgba(255,255,255,.09);--px:clamp(12px,3vw,32px);--bh:44px;--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font:300 12px "Space Grotesk","Helvetica Neue",Arial,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#bar{position:fixed;top:0;left:0;right:0;z-index:2;padding:var(--st) var(--px) 0;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;column-gap:12px;background:var(--bg);border-bottom:1px solid var(--hl)}
.g{display:flex;gap:4px;align-items:center;min-height:var(--bh)}
#qs{flex:1 1 auto;justify-content:center}
#qs[hidden]{display:none}
.lb{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--fa);margin-right:6px}
button{font:inherit;color:var(--fa);background:none;border:0;cursor:pointer;transition:color .25s}
button:hover{color:var(--dim)}
button:focus-visible{outline:1px solid var(--cu);outline-offset:3px}
.tab{padding:8px 12px;font-size:10px;letter-spacing:.26em;text-transform:uppercase;font-weight:500;border-bottom:1px solid transparent}
.tab.on{color:var(--ink);border-color:var(--cu)}
.q{padding:6px 9px;border:1px solid var(--hl);border-radius:3px;font-size:11px;letter-spacing:.1em}
.q.on{color:var(--ink);border-color:var(--cu)}
.tg{display:flex;align-items:center;gap:8px;padding:8px 6px;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase}
.tg:before{content:"";width:5px;height:5px;border-radius:50%;background:rgba(217,154,99,.22)}
.tg.on{color:var(--dim)}.tg.on:before{background:var(--cu);box-shadow:0 0 6px rgba(217,154,99,.4)}
#rt{gap:14px}.nr{display:none}
iframe{position:fixed;left:0;right:0;bottom:0;top:var(--top,44px);width:100%;height:calc(100% - var(--top,44px));border:0;background:var(--bg)}
iframe[hidden]{display:none}
@media(max-width:640px){#rt{order:2;gap:6px}#qs{order:3;flex-basis:100%}.lb,.wd{display:none}.nr{display:inline}}
</style></head>

 document.querySelectorAll('#ql .q').forEach(b=>{const on=b.dataset.l===l;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
 push()};

 try{history.replaceState(null,'',t3?'#lista3-q'+q:'#lista2')}catch(e){}};
